<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sky2)"/>
  
  <!-- Distant Mountains -->
  <polygon points="-20,320 180,180 340,320" fill="#64748b" opacity="0.6"/>
  <polygon points="120,230 180,180 240,230" fill="#f8fafc" opacity="0.8"/>
  <polygon points="260,320 480,140 680,320" fill="#475569" opacity="0.7"/>
  <polygon points="410,200 480,140 550,200" fill="#f8fafc" opacity="0.8"/>
  
  <!-- Rolling Green Hills -->
  <path d="M-10,310 Q 180,240 380,300 T 810,290 L 810,460 L -10,460 Z" fill="url(#grassGrad)"/>

  <!-- River winding -->
  <path d="M 460,450 C 400,380 430,340 370,300 L 410,300 C 470,340 440,380 540,450 Z" fill="url(#riverGrad)"/>

  <!-- Windmill -->
  <rect x="140" y="190" width="70" height="110" fill="#f1f5f9" stroke="#78350f" stroke-width="3"/>
  <polygon points="130,190 175,130 220,190" fill="#991b1b"/>
  <!-- Windmill blades -->
  <line x1="175" y1="160" x2="175" y2="80" stroke="#b45309" stroke-width="5"/>
  <line x1="175" y1="160" x2="175" y2="240" stroke="#b45309" stroke-width="5"/>
  <line x1="175" y1="160" x2="95" y2="160" stroke="#b45309" stroke-width="5"/>
  <line x1="175" y1="160" x2="255" y2="160" stroke="#b45309" stroke-width="5"/>
  <!-- Sails -->
  <polygon points="175,80 195,115 175,115" fill="#f8fafc" opacity="0.9"/>
  <polygon points="175,240 155,205 175,205" fill="#f8fafc" opacity="0.9"/>
  <polygon points="95,160 130,140 130,160" fill="#f8fafc" opacity="0.9"/>
  <polygon points="255,160 220,180 220,160" fill="#f8fafc" opacity="0.9"/>
  <circle cx="175" cy="160" r="6" fill="#78350f"/>

  <!-- Medieval Cottage 1 -->
  <rect x="520" y="240" width="110" height="70" fill="#d97706" stroke="#451a03" stroke-width="2"/>
  <polygon points="505,240 575,190 645,240" fill="#78350f"/>
  <rect x="545" y="270" width="22" height="40" fill="#451a03"/>
  <rect x="585" y="260" width="25" height="25" fill="#fef08a" stroke="#451a03" stroke-width="2" filter="url(#glow2)"/>

  <!-- Medieval Cottage 2 -->
  <rect x="660" y="260" width="90" height="60" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <polygon points="650,260 705,220 760,260" fill="#475569"/>
  <rect x="690" y="275" width="20" height="20" fill="#fef08a" stroke="#334155" stroke-width="2" filter="url(#glow2)"/>

  <!-- Haybales & Lanterns -->
  <rect x="470" y="290" width="20" height="15" fill="#eab308"/>
  <rect x="475" y="278" width="18" height="12" fill="#ca8a04"/>
  <circle cx="510" cy="270" r="4" fill="#fbbf24" filter="url(#glow2)"/>

  <!-- Minecraft pixel trees -->
  <rect x="70" y="270" width="16" height="50" fill="#78350f"/>
  <rect x="45" y="210" width="66" height="65" fill="#15803d"/>
  <rect x="55" y="195" width="46" height="25" fill="#16a34a"/>
  
  <rect x="20" y="390" width="230" height="40" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#22c55e" stroke-width="1"/>
  <text x="35" y="415" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">★ ДЕРЕВНЯ И ФЕРМА</text>
</svg>

