<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="caveBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="lavaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="caveGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#caveBg)"/>

  <!-- Cave Ceiling Rock Jagged -->
  <polygon points="0,0 800,0 800,120 720,80 640,140 560,90 480,130 380,70 300,150 200,80 120,130 0,60" fill="#1e293b"/>
  <polygon points="0,0 800,0 800,90 730,50 630,100 520,60 410,100 310,40 180,90 0,40" fill="#334155"/>

  <!-- Lava Waterfall Right Side -->
  <path d="M 640,120 Q 620,250 650,400 L 730,400 Q 710,250 690,120 Z" fill="url(#lavaGrad)" filter="url(#caveGlow)"/>
  <rect x="610" y="380" width="180" height="70" fill="url(#lavaGrad)" filter="url(#caveGlow)"/>
  
  <!-- Glowing Amethyst Geode Left Side -->
  <ellipse cx="140" cy="260" rx="110" ry="120" fill="#3b0764"/>
  <ellipse cx="140" cy="260" rx="90" ry="100" fill="#581c87"/>
  <!-- Amethyst Crystals -->
  <polygon points="110,230 125,200 135,230" fill="#d8b4fe" filter="url(#caveGlow)"/>
  <polygon points="140,250 160,210 170,250" fill="#c084fc" filter="url(#caveGlow)"/>
  <polygon points="100,280 80,260 115,265" fill="#e9d5ff" filter="url(#caveGlow)"/>
  <polygon points="150,290 185,280 160,310" fill="#c084fc"/>
  <polygon points="120,310 135,335 110,330" fill="#a855f7"/>

  <!-- Minecart Rails & Wooden Supports -->
  <rect x="260" y="240" width="18" height="150" fill="#78350f"/>
  <rect x="420" y="220" width="18" height="170" fill="#78350f"/>
  <rect x="250" y="235" width="200" height="18" fill="#92400e"/>
  
  <!-- Railway Track Bridge -->
  <polygon points="200,340 540,320 540,340 200,360" fill="#475569"/>
  <!-- Planks -->
  <line x1="230" y1="337" x2="230" y2="357" stroke="#78350f" stroke-width="4"/>
  <line x1="280" y1="334" x2="280" y2="354" stroke="#78350f" stroke-width="4"/>
  <line x1="330" y1="331" x2="330" y2="351" stroke="#78350f" stroke-width="4"/>
  <line x1="380" y1="328" x2="380" y2="348" stroke="#78350f" stroke-width="4"/>
  <line x1="430" y1="325" x2="430" y2="345" stroke="#78350f" stroke-width="4"/>
  <line x1="480" y1="322" x2="480" y2="342" stroke="#78350f" stroke-width="4"/>

  <!-- Diamond Ore Vein -->
  <rect x="330" y="160" width="45" height="45" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <rect x="338" y="168" width="10" height="8" fill="#38bdf8" filter="url(#caveGlow)"/>
  <rect x="355" y="180" width="12" height="9" fill="#00f2fe" filter="url(#caveGlow)"/>
  <rect x="345" y="190" width="8" height="8" fill="#38bdf8" filter="url(#caveGlow)"/>

  <!-- Hanging Glowstone Lantern -->
  <line x1="270" y1="130" x2="270" y2="180" stroke="#64748b" stroke-width="2"/>
  <rect x="260" y="180" width="20" height="24" fill="#fbbf24" stroke="#78350f" stroke-width="2" filter="url(#caveGlow)"/>
  
  <!-- Cave Floor -->
  <polygon points="0,380 800,370 800,450 0,450" fill="#0f172a"/>

  <rect x="20" y="390" width="230" height="40" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1"/>
  <text x="35" y="415" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">★ ШАХТА И РУДЫ</text>
</svg>

