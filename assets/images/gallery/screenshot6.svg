<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="nightGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nightSky)"/>

  <!-- Stars & Moon -->
  <rect x="680" y="40" width="40" height="40" fill="#fef08a" filter="url(#nightGlow)"/>
  <circle cx="100" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="80" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="390" cy="35" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="530" cy="75" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Background Pine Trees Silhouette -->
  <polygon points="50,260 80,180 110,260" fill="#064e3b"/>
  <polygon points="90,260 120,160 150,260" fill="#022c22"/>
  <polygon points="620,260 650,150 680,260" fill="#022c22"/>
  <polygon points="660,260 690,170 720,260" fill="#064e3b"/>

  <!-- Ground Shoreline -->
  <polygon points="0,260 800,260 800,320 0,320" fill="#14532d"/>

  <!-- Wooden Cabin (Spruce & Dark Oak) -->
  <rect x="260" y="170" width="280" height="110" fill="#451a03" stroke="#270e02" stroke-width="3"/>
  
  <!-- A-Frame Roof with Overhang -->
  <polygon points="240,170 400,90 560,170" fill="#78350f" stroke="#270e02" stroke-width="3"/>
  <polygon points="255,165 400,98 545,165" fill="#92400e"/>
  
  <!-- Chimney with Smoke -->
  <rect x="470" y="90" width="24" height="40" fill="#475569"/>
  <circle cx="482" cy="75" r="6" fill="#94a3b8" opacity="0.6"/>
  <circle cx="490" cy="58" r="9" fill="#94a3b8" opacity="0.4"/>
  <circle cx="505" cy="40" r="13" fill="#94a3b8" opacity="0.2"/>

  <!-- Glowing Windows with Curtains -->
  <rect x="290" y="195" width="45" height="45" fill="#fef08a" stroke="#270e02" stroke-width="3" filter="url(#nightGlow)"/>
  <line x1="312" y1="195" x2="312" y2="240" stroke="#270e02" stroke-width="2"/>
  <line x1="290" y1="217" x2="335" y2="217" stroke="#270e02" stroke-width="2"/>

  <rect x="465" y="195" width="45" height="45" fill="#fef08a" stroke="#270e02" stroke-width="3" filter="url(#nightGlow)"/>
  <line x1="487" y1="195" x2="487" y2="240" stroke="#270e02" stroke-width="2"/>
  <line x1="465" y1="217" x2="510" y2="217" stroke="#270e02" stroke-width="2"/>

  <!-- Front Door & Warm Porch Light -->
  <rect x="375" y="210" width="50" height="70" fill="#270e02"/>
  <circle cx="400" cy="195" r="7" fill="#f59e0b" filter="url(#nightGlow)"/>
  <rect x="396" y="190" width="8" height="10" fill="#ffffff"/>

  <!-- Wooden Pier extending into lake -->
  <rect x="360" y="280" width="80" height="60" fill="#78350f" stroke="#270e02" stroke-width="2"/>
  <rect x="375" y="330" width="12" height="30" fill="#451a03"/>
  <rect x="415" y="330" width="12" height="30" fill="#451a03"/>
  <!-- Lantern on Pier -->
  <rect x="430" y="260" width="12" height="20" fill="#fbbf24" stroke="#270e02" stroke-width="1.5" filter="url(#nightGlow)"/>

  <!-- Lake Water Surface with Reflections -->
  <polygon points="0,320 800,320 800,450 0,450" fill="url(#waterGrad)"/>
  <!-- Reflection streaks -->
  <ellipse cx="400" cy="350" rx="90" ry="6" fill="#fef08a" opacity="0.3" filter="url(#nightGlow)"/>
  <ellipse cx="400" cy="380" rx="70" ry="4" fill="#fbbf24" opacity="0.2"/>
  <ellipse cx="400" cy="410" rx="40" ry="3" fill="#f59e0b" opacity="0.15"/>
  <ellipse cx="700" cy="340" rx="25" ry="4" fill="#fef08a" opacity="0.25"/>

  <rect x="20" y="390" width="230" height="40" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
  <text x="35" y="415" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">★ УСАДЬБА У ОЗЕРА</text>
</svg>
