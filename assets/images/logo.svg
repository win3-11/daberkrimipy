<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="24" cy="24" r="20" fill="#22c55e" opacity="0.15" filter="url(#neonGlow)"/>
  
  <!-- Isometric 3D Minecraft Block -->
  <!-- Top Face (Grass) -->
  <polygon points="24,6 40,15 24,24 8,15" fill="url(#cubeTop)" stroke="#86efac" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Pixel grass drapes -->
  <polygon points="12,17.2 16,19.5 16,23 12,21" fill="#22c55e" opacity="0.8"/>
  <polygon points="20,21.8 24,24 24,28 20,26" fill="#22c55e" opacity="0.8"/>
  <polygon points="28,21.8 32,19.5 32,24 28,26" fill="#16a34a" opacity="0.9"/>
  <polygon points="36,17.2 40,15 40,19 36,21" fill="#16a34a" opacity="0.9"/>
  
  <!-- Left Face (Dirt) -->
  <polygon points="8,15 24,24 24,42 8,33" fill="url(#cubeLeft)" stroke="#14532d" stroke-width="1" stroke-linejoin="round"/>
  <!-- Left Dirt Pixel Details -->
  <rect x="12" y="24" width="4" height="4" fill="#14532d" opacity="0.6" transform="skewY(30)"/>
  <rect x="18" y="28" width="3" height="3" fill="#052e16" opacity="0.8" transform="skewY(30)"/>
  
  <!-- Right Face (Dirt) -->
  <polygon points="24,24 40,15 40,33 24,42" fill="url(#cubeRight)" stroke="#14532d" stroke-width="1" stroke-linejoin="round"/>
  <!-- Right Dirt Pixel Details -->
  <rect x="28" y="10" width="4" height="4" fill="#15803d" opacity="0.6" transform="skewY(-30)"/>
  <rect x="34" y="14" width="3" height="3" fill="#14532d" opacity="0.8" transform="skewY(-30)"/>

  <!-- Core Crystal / Sparkle -->
  <circle cx="24" cy="24" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <polygon points="24,19 25.5,23 29,24 25.5,25 24,29 22.5,25 19,24 22.5,23" fill="#ffffff"/>
</svg>

